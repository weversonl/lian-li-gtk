[package]
name = "lian-li-gtk"
version = "0.1.0"
edition = "2021"

[dependencies]
lianli-shared = { git = "https://github.com/sgtaziz/lian-li-linux", rev = "cdb050088d8882b0da159035f14e13898b48cf22" }
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
async-net = "2.0"
async-io = "2.6"
futures-lite = "2.3"
ksni = { version = "0.3", features = ["blocking"] }
async-channel = "2"
